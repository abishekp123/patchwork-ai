name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  docker-integration:
    name: Real Docker / Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PATCHWORK_RUN_DOCKER_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - name: Prepare pinned multi-platform image
        run: |
          docker info
          docker pull --platform linux/amd64 python@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
      - name: Build reviewed dependency environment
        run: |
          python ../scripts/build_verification_image.py > image-build.log
          echo "PATCHWORK_TEST_IMAGE=$(tail -n 1 image-build.log)" >> "$GITHUB_ENV"
      - name: Execute real sandbox tests
        run: pytest -m docker_integration tests/test_docker_integration.py --junitxml=docker-results.xml
      - name: Require executed tests without skips
        if: always()
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          cases = ET.parse("docker-results.xml").getroot().findall(".//testcase")
          assert len(cases) >= 10, "Real Docker tests were not collected"
          assert all(not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")) for case in cases), "Docker tests failed or skipped"
          PYCODE

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Browser workflows against real API and Docker
        working-directory: frontend
        env:
          PATCHWORK_TEST_PYTHON: python
        run: PATCHWORK_VERIFICATION_IMAGE="$PATCHWORK_TEST_IMAGE" npm run test:browser
